<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNN-ETM Demonstrator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        const DEFAULT_PARQUET_PATH = 'data/merged_tc_data_1x1_flat_20_128_bbbar_0.parquet';

        const parquetPathBySelection = {
            low_bhabha: 'data/merged_tc_data_1x1_flat_20_128_bhabha_exp1003_0.parquet',
            high_bhabha: 'data/merged_tc_data_1x1_flat_20_128_bhabha_exp0_0.parquet',
            low_dimuon: 'data/merged_tc_data_1x1_flat_20_128_kkmc_exp1003_0.parquet',
            high_dimuon: 'data/merged_tc_data_1x1_flat_20_128_kkmc_exp0_0.parquet',
            low_bbbar: 'data/merged_tc_data_1x1_flat_20_128_bbbar_exp1003_0.parquet',
            high_bbbar: 'data/merged_tc_data_1x1_flat_20_128_bbbar_exp0_0.parquet',
        };

        function runAcceleratorFromParquet() {
            const beamBgSlider = document.getElementById('beam-bg-slider');
            const selectedProcess = document.querySelector('input[name="physicsProcess"]:checked');
            const selectedProcessLabel = selectedProcess
                ? document.querySelector(`label[for="${selectedProcess.id}"]`)
                : null;

            const diagramFrame = document.getElementById('diagram-iframe');
            if (diagramFrame) {
                diagramFrame.src = `/diagram?animate=1&run=${Date.now()}`;
            }

            const beamBackgroundLevels = ['low', 'high'];
            const beamBackgroundLabels = ['Low Background', 'High Background'];
            const beamBackgroundIndex = beamBgSlider ? Number(beamBgSlider.value) : 0;
            const selectedBeamBgValue = beamBackgroundLevels[beamBackgroundIndex] || 'low';
            const selectedBeamBgLabel = beamBackgroundLabels[beamBackgroundIndex] || 'Low Background';

            if (!selectedProcess) {
                console.error('Please select a physics process.');
                return;
            }

            const selectionKey = `${selectedBeamBgValue}_${selectedProcess.value}`;
            const parquetPath = parquetPathBySelection[selectionKey] || DEFAULT_PARQUET_PATH;

            fetch('/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    parquet_path: parquetPath,
                    physics_process: selectedProcess.value,
                    physics_process_label: selectedProcessLabel ? selectedProcessLabel.textContent.trim() : selectedProcess.value,
                    beam_background_level: selectedBeamBgValue,
                    beam_background_label: selectedBeamBgLabel
                })
            })
            .then(response => response.json())
            .then(data => console.log('Success:', { selectionKey, parquetPath, data }))
            .catch(error => console.error('Error:', error));
        }

        function updateBeamBackgroundLabel() {
            const beamBgSlider = document.getElementById('beam-bg-slider');
            const beamBgCurrent = document.getElementById('beam-bg-current');
            if (!beamBgSlider || !beamBgCurrent) {
                return;
            }

            beamBgCurrent.textContent = Number(beamBgSlider.value) === 1 ? 'High Background' : 'Low Background';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const beamBgSlider = document.getElementById('beam-bg-slider');
            if (!beamBgSlider) {
                return;
            }
            beamBgSlider.addEventListener('input', updateBeamBackgroundLabel);
            updateBeamBackgroundLabel();
        });
    </script>
    <style>
        body { background-color: #f8f9fa; }
        .main-container { max-width: 1400px; margin: 0 auto; }
        #stream-img { width: 100%; border-radius: 0.375rem; }
        .slider-label { font-weight: 500; margin-bottom: 0.25rem; }
        .slider-value { font-family: monospace; font-size: 0.9rem; }
        .selection-group-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #334155;
        }
        .process-list {
            display: grid;
            gap: 0.5rem;
        }
        .process-item {
            position: relative;
        }
        .process-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .process-item-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            width: 100%;
            padding: 0.55rem 0.65rem;
            border: 1px solid #ced4da;
            border-radius: 0.5rem;
            background-color: #ffffff;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .process-item-text {
            color: #1f2937;
            font-size: 0.875rem;
            line-height: 1.2;
        }
        .process-switch {
            position: relative;
            flex: 0 0 auto;
            width: 38px;
            height: 22px;
            border-radius: 999px;
            background-color: #adb5bd;
            transition: background-color 0.15s ease;
        }
        .process-switch::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease;
        }
        .process-input:checked + .process-item-label {
            border-color: #198754;
            background-color: #f3fbf7;
        }
        .process-input:checked + .process-item-label .process-switch {
            background-color: #198754;
        }
        .process-input:checked + .process-item-label .process-switch::after {
            transform: translateX(16px);
        }
        .process-input:focus-visible + .process-item-label {
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.2);
        }
        .selection-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .action-btn {
            display: block;
            width: 100%;
            padding: 0.55rem 0.65rem;
            text-align: center;
            font-weight: 500;
            border-width: 1px;
            border-radius: 0.5rem;
        }
        .selection-btn {
            color: #ffffff;
            opacity: 0.8;
            filter: saturate(0.65);
        }
        .run-btn {
            background-color: #eefaf2;
            border-color: #198754;
            color: #14532d;
            font-weight: 600;
        }
        .run-btn:hover {
            background-color: #e3f6ea;
            border-color: #198754;
            color: #14532d;
        }
        .run-btn:active {
            background-color: #d9f2e3 !important;
            border-color: #198754 !important;
            color: #14532d !important;
        }
        .run-btn:focus {
            background-color: #eefaf2;
            border-color: #198754;
            color: #14532d;
            box-shadow: none;
        }
        .run-btn:focus-visible {
            background-color: #eefaf2;
            border-color: #198754;
            color: #14532d;
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.2) !important;
        }
        .selection-input + .selection-btn:active,
        .selection-input:checked + .selection-btn:active {
            color: #ffffff !important;
        }
        .selection-input:checked + .selection-btn {
            box-shadow: 0 0 0 0.2rem rgba(17, 24, 39, 0.22);
            filter: brightness(1);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4 main-container">
        <h4 class="mb-4">GNN-ETM Demonstrator</h4>
        <div class="row">
            <!-- Stream -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header">Event Display</div>
                    <div class="card-body p-2">
                        <iframe id="threejs-iframe" src="/event_display" style="width: 100%; height: 500px; border: none;"></iframe>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header">Experiment Control</div>
                    <div class="card-body">
                        <div class="selection-group-title">Beam Background Level</div>
                        <div class="mb-3">
                            <input type="range" class="form-range" id="beam-bg-slider" min="0" max="1" step="1" value="0">
                            <div class="d-flex justify-content-between small text-muted">
                                <span>Low Background</span>
                                <span>High Background</span>
                            </div>
                            <div class="slider-value mt-1">Selected: <span id="beam-bg-current">Low Background</span></div>
                        </div>

                        <div class="selection-group-title">Physics Process</div>
                        <div class="process-list">
                            <div class="process-item">
                                <input class="process-input" type="radio" name="physicsProcess" id="proc-bhabha" value="bhabha">
                                <label class="process-item-label" for="proc-bhabha">
                                    <span class="process-item-text">Bhabha: e<sup>+</sup>e<sup>−</sup> → e<sup>+</sup>e<sup>−</sup></span>
                                    <span class="process-switch" aria-hidden="true"></span>
                                </label>
                            </div>

                            <div class="process-item">
                                <input class="process-input" type="radio" name="physicsProcess" id="proc-dimuon" value="dimuon">
                                <label class="process-item-label" for="proc-dimuon">
                                    <span class="process-item-text">Dimuon: e<sup>+</sup>e<sup>−</sup> → μ<sup>+</sup>μ<sup>−</sup></span>
                                    <span class="process-switch" aria-hidden="true"></span>
                                </label>
                            </div>

                            <div class="process-item">
                                <input class="process-input" type="radio" name="physicsProcess" id="proc-bbbar" value="bbbar" checked>
                                <label class="process-item-label" for="proc-bbbar">
                                    <span class="process-item-text">BB̄: e<sup>+</sup>e<sup>−</sup> → BB̄</span>
                                    <span class="process-switch" aria-hidden="true"></span>
                                </label>
                            </div>
                        </div>

                        <div class="mt-3">
                            <button class="btn btn-sm w-100 action-btn run-btn" onclick="runAcceleratorFromParquet()">Run Accelerator</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="row mt-3">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header">Diagram</div>
                    <div class="card-body p-2">
                        <iframe id="diagram-iframe" src="/diagram?animate=0" style="width: 100%; height: 350px; border: none;"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
