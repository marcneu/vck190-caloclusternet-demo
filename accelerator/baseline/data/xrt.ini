[Debug]
aie_trace=true
device_trace=fine
host_trace=true
aie_profile=true
aie_status=true

# PL Trace buffer
trace_buffer_size = 32M
trace_buffer_offload_interval_ms = 5

[AIE_trace_settings]
reuse_buffer = true
periodic_offload = true
buffer_offload_interval_us = 100
buffer_size = 16M
tile_based_aie_metrics = all:heat_map
graph_based_aie_tile_metrics = dut:all:all_stalls
enable_system_timeline = true